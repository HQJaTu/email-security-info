name: Unit tests

# Every push, so a branch is known-good before anyone opens a pull request from
# it, and every pull request against master, so what is tested is the merge
# result rather than the branch tip on its own.
#
# A branch pushed inside this repository and then opened as a pull request runs
# both — the same commit tested twice. That is the price of testing branches
# before they become pull requests; narrow `push` to `branches: [master]` if the
# duplicate runs ever become the bigger annoyance.
on:
  push:
  pull_request:
    branches:
      - master

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # One version failing must not hide what the others would have said —
      # "3.11 broke" and "everything broke" need different fixes.
      fail-fast: false
      matrix:
        # 3.11 is the floor README.md promises; 3.14 is what it is developed on.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The suite is stdlib unittest, so the program's own single dependency is
      # everything it needs. pytest is supported but optional, and left out here
      # deliberately: a test run should not be able to fail over a test runner
      # the tests do not require.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # From the project root, as tests/README.md documents. No network, no DNS,
      # no state outside self-cleaning temporary directories.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest

    # Static analysis of code whose tests fail tells you the less interesting
    # half of the story, so wait for the answer that matters first.
    needs: test

    # Secrets are withheld from pull requests opened off a fork, so the scan
    # would fail on the missing token rather than on anything about the code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar attributes "new code" with git blame, which a shallow clone
          # cannot answer — without the history every line looks new.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      # coverage is a CI-only tool and deliberately not in requirements-dev.txt:
      # nothing in the suite imports it, and running the tests must not depend
      # on having it.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt coverage

      # The Sonar way quality gate wants 80% coverage of new code, so without a
      # report every change is measured as 0% and fails the gate on arrival.
      - name: Measure coverage
        run: |
          python -m coverage run --source=. --omit='tests/*' -m unittest discover -s tests
          python -m coverage report
          python -m coverage xml

      # Project key, organisation and report paths come from
      # sonar-project.properties in the repository root.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
