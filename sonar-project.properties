# SonarQube Cloud (sonarcloud.io) analysis settings.
#
# Read by the scanner step in .github/workflows/tests.yml. Keeping them here
# rather than in the workflow's `args` means `sonar-scanner` run by hand from a
# checkout analyses exactly what CI does.

sonar.projectKey=HQJaTu_email-security-info
sonar.organization=hqjatu

# The deliverable is the one file; everything under tests/ is test code and is
# reported separately, so a rule that only makes sense for production code does
# not fire on a test helper.
sonar.sources=message-security-info.py
sonar.tests=tests

# Sample messages and their recorded results are data, not code. They are not
# written by hand and there is nothing in them for a linter to say.
sonar.test.exclusions=tests/emails/**,tests/expected/**

sonar.sourceEncoding=UTF-8

# The versions CI runs, so the analyser flags anything that would break on the
# oldest of them rather than judging by the newest alone.
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Written by the `coverage xml` step just before the scan.
sonar.python.coverage.reportPaths=coverage.xml
